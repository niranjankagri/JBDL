<!DOCTYPE html>
<!-- The VIEW: Thymeleaf replaces th:* attributes with data from the model the controller filled -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore</title>
</head>
<body>
<h1 th:text="${author} ? 'Books by ' + ${author} : 'All books'">All books</h1>
<p th:if="${#lists.isEmpty(books)}">No books yet.</p>
<table th:unless="${#lists.isEmpty(books)}">
    <thead><tr><th>Title</th><th>Author</th><th>Year</th><th>Price</th></tr></thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.publishedYear}">2024</td>
        <td th:text="${book.price}">0.00</td>
    </tr>
    </tbody>
</table>
</body>
</html>
